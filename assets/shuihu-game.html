<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水浒传 · 横版闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0a08;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
(function(){
var C=document.getElementById('gc'),X=C.getContext('2d');
var W,H,GRAVITY=0.6,JUMP=-13,SPEED=5;
var keys={},state='menu',score=0,lives=3,level=1,maxLevel=3;
var camX=0,shakeX=0,shakeY=0,shakeTime=0;
var player,enemies,platforms,particles,coins,goalX;
var bgStars=[];

function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

// Generate background stars
for(var i=0;i<60;i++) bgStars.push({x:Math.random()*3000,y:Math.random()*H*0.6,s:Math.random()*2+0.5,b:Math.random()});

// === LEVEL BUILDER ===
function buildLevel(lv){
  platforms=[];enemies=[];coins=[];particles=[];
  camX=0;score=0;
  var groundY=H*0.78;
  goalX=3500+lv*1500;

  // Ground segments
  var gx=0;
  while(gx<goalX+500){
    var gw=150+Math.random()*250;
    platforms.push({x:gx,y:groundY,w:gw,h:200,type:'ground'});
    gx+=gw;
    if(Math.random()<0.3-lv*0.05){gx+=80+Math.random()*60;}// gap
  }

  // Floating platforms
  var px=300;
  while(px<goalX){
    var py=groundY-80-Math.random()*150;
    platforms.push({x:px,y:py,w:80+Math.random()*60,h:16,type:'float'});
    px+=200+Math.random()*300;
  }

  // Coins
  for(var i=0;i<20+lv*10;i++){
    var cx=200+i*(goalX/30)+Math.random()*100;
    coins.push({x:cx,y:groundY-40-Math.random()*120,collected:false,bob:Math.random()*Math.PI*2});
  }

  // Enemies
  var names=['镇关西','西门庆','高衙内','蒋门神','张都监','陆谦','庞万春','方腊'];
  for(var i=0;i<8+lv*5;i++){
    var ex=400+i*(goalX/(13+lv*5))+Math.random()*80;
    var etype=Math.random()<0.3+lv*0.1?'archer':'soldier';
    enemies.push({
      x:ex,y:groundY-40,w:30,h:40,
      vx:etype==='soldier'?(1+Math.random())*(lv>1?1.5:1):0,
      type:etype,alive:true,
      hp:etype==='archer'?1:2,
      name:names[i%names.length],
      shootTimer:etype==='archer'?100+Math.random()*60:999,
      startX:ex,range:100+Math.random()*100
    });
  }

  // Boss at end
  var bossName=lv===1?'高俅':lv===2?'方腊':'蔡京';
  enemies.push({
    x:goalX-60,y:groundY-60,w:50,h:60,
    vx:0,type:'boss',alive:true,hp:5+lv*3,
    name:bossName,
    shootTimer:50,startX:goalX-60,range:40,isBoss:true,
    isGaoQiu:lv===1,
    kickTimer:lv===1?30:9999,
    kickCombo:0,kickStyle:0,
    jumpY:0,jumpVY:0,isBossJumping:false
  });

  // Player
  player={x:80,y:groundY-60,w:28,h:44,vx:0,vy:0,grounded:false,
    facing:1,attacking:false,atkTimer:0,atkCD:0,
    invincible:0,hurtTimer:0,animFrame:0,animTimer:0};
}

// === INPUT ===
document.addEventListener('keydown',function(e){keys[e.code]=true;e.preventDefault()});
document.addEventListener('keyup',function(e){keys[e.code]=false});
C.addEventListener('touchstart',handleTouch,{passive:false});
C.addEventListener('touchmove',handleTouch,{passive:false});
C.addEventListener('touchend',function(){keys['ArrowLeft']=false;keys['ArrowRight']=false;keys['Space']=false;keys['KeyZ']=false});
function handleTouch(e){
  e.preventDefault();
  keys['ArrowLeft']=false;keys['ArrowRight']=false;keys['Space']=false;keys['KeyZ']=false;
  for(var i=0;i<e.touches.length;i++){
    var t=e.touches[i];
    if(t.clientX<W/3)keys['ArrowLeft']=true;
    else if(t.clientX>W*2/3)keys['ArrowRight']=true;
    else{keys['Space']=true;keys['KeyZ']=true}
  }
}

// === UPDATE ===
function update(){
  if(state!=='playing')return;
  var p=player;

  // Movement
  p.vx=0;
  if(keys['ArrowLeft']||keys['KeyA']){p.vx=-SPEED;p.facing=-1}
  if(keys['ArrowRight']||keys['KeyD']){p.vx=SPEED;p.facing=1}

  // Jump
  if((keys['Space']||keys['ArrowUp']||keys['KeyW'])&&p.grounded){p.vy=JUMP;p.grounded=false}

  // Attack
  if((keys['KeyZ']||keys['KeyJ'])&&p.atkCD<=0){p.attacking=true;p.atkTimer=12;p.atkCD=20}

  // Gravity
  p.vy+=GRAVITY;
  p.x+=p.vx;p.y+=p.vy;
  if(p.x<0)p.x=0;

  // Platform collision
  p.grounded=false;
  for(var i=0;i<platforms.length;i++){
    var pl=platforms[i];
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w){
      if(p.y+p.h>pl.y&&p.y+p.h<pl.y+pl.h+15&&p.vy>=0){
        p.y=pl.y-p.h;p.vy=0;p.grounded=true;
      }
    }
  }

  // Fall death
  if(p.y>H+100){die();return}

  // Timers
  if(p.atkTimer>0)p.atkTimer--;
  if(p.atkTimer<=0)p.attacking=false;
  if(p.atkCD>0)p.atkCD--;
  if(p.invincible>0)p.invincible--;
  if(p.hurtTimer>0)p.hurtTimer--;
  p.animTimer++;
  if(p.animTimer>6){p.animTimer=0;p.animFrame=(p.animFrame+1)%4}

  // Coins
  for(var i=0;i<coins.length;i++){
    var c=coins[i];
    if(!c.collected&&Math.abs(p.x+p.w/2-c.x)<25&&Math.abs(p.y+p.h/2-c.y)<25){
      c.collected=true;score+=10;
      spawnParticles(c.x,c.y,'#eab308',6);
    }
  }

  // Enemies
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.alive)continue;

    // Movement
    if(e.type==='soldier'||e.type==='boss'){
      e.x+=e.vx;
      if(e.x<e.startX-e.range||e.x>e.startX+range(e))e.vx*=-1;
    }

    // Archer/Boss shooting (高俅用足球!)
    if(e.type==='archer'||(e.type==='boss'&&!e.isGaoQiu)){
      e.shootTimer--;
      if(e.shootTimer<=0){
        e.shootTimer=e.type==='boss'?40:120-Math.min(level*10,60);
        var dx=p.x-e.x;
        if(Math.abs(dx)<400){
          particles.push({
            x:e.x+(e.isBoss?25:15),y:e.y+10,vx:dx>0?4:-4,vy:0,
            life:80,type:'arrow',w:12,h:4
          });
        }
      }
    }

    // 高俅踢足球 - 花式蹴鞠!
    if(e.isGaoQiu&&e.alive){
      // Boss jump
      if(e.isBossJumping){
        e.jumpVY+=0.5;
        e.jumpY+=e.jumpVY;
        if(e.jumpY>=0){e.jumpY=0;e.jumpVY=0;e.isBossJumping=false}
      }
      // Kick timer
      e.kickTimer--;
      if(e.kickTimer<=0){
        e.kickCombo=(e.kickCombo+1)%5;
        e.kickStyle=e.kickCombo;
        var dx=p.x-e.x;
        var dist=Math.abs(dx);
        e.kickTimer=e.kickCombo===4?60:35-level*3;
        e.kickTimer=Math.max(e.kickTimer,18);

        if(e.kickStyle===0){
          // 直线球
          particles.push({x:e.x,y:e.y+20,vx:dx>0?6:-6,vy:-1,life:100,type:'football',r:10});
        }else if(e.kickStyle===1){
          // 高空球
          particles.push({x:e.x,y:e.y+20,vx:dx>0?5:-5,vy:-8,life:100,type:'football',r:10});
        }else if(e.kickStyle===2){
          // 地滚球
          particles.push({x:e.x,y:e.y+50,vx:dx>0?7:-7,vy:0,life:80,type:'football',r:10});
        }else if(e.kickStyle===3){
          // 颠球连射2个
          particles.push({x:e.x,y:e.y+10,vx:dx>0?4:-4,vy:-6,life:90,type:'football',r:10});
          particles.push({x:e.x,y:e.y+15,vx:dx>0?5:-5,vy:-3,life:90,type:'football',r:10});
          // 跳起来踢
          if(!e.isBossJumping){e.isBossJumping=true;e.jumpVY=-8}
        }else{
          // 大力抽射 - 超快球
          particles.push({x:e.x,y:e.y+25,vx:dx>0?10:-10,vy:-2,life:60,type:'football',r:12,
            color:'#ff4444',isPower:true});
          addShake(4);
        }
      }
    }

    // Player attack hits enemy
    if(p.attacking&&p.atkTimer>6){
      var ax=p.x+(p.facing>0?p.w:-35);
      var aw=35,ah=30,ay=p.y+5;
      if(ax<e.x+e.w&&ax+aw>e.x&&ay<e.y+e.h&&ay+ah>e.y){
        e.hp--;
        if(e.hp<=0){
          e.alive=false;score+=e.isBoss?200:50;
          spawnParticles(e.x+e.w/2,e.y+e.h/2,'#ef4444',12);
          addShake(6);
        }else{addShake(3)}
      }
    }

    // Enemy hits player
    if(p.invincible<=0&&!p.attacking){
      if(p.x+p.w>e.x&&p.x<e.x+e.w&&p.y+p.h>e.y&&p.y<e.y+e.h){
        die();return;
      }
    }
  }

  // Arrow/Football hits player
  for(var i=particles.length-1;i>=0;i--){
    var ar=particles[i];
    if(p.invincible<=0){
      if(ar.type==='arrow'){
        if(p.x+p.w>ar.x&&p.x<ar.x+ar.w&&p.y+p.h>ar.y-5&&p.y<ar.y+ar.h+5){
          die();return;
        }
      }else if(ar.type==='football'){
        var dx2=(p.x+p.w/2)-ar.x,dy2=(p.y+p.h/2)-ar.y;
        if(Math.sqrt(dx2*dx2+dy2*dy2)<ar.r+15){
          spawnParticles(ar.x,ar.y,'#fff',8);
          addShake(8);
          die();return;
        }
      }
    }
  }

  // Goal
  if(p.x>goalX){
    if(level<maxLevel){level++;buildLevel(level)}
    else{state='win'}
  }

  // Camera
  var targetCam=p.x-W*0.35;
  camX+=(targetCam-camX)*0.08;
  if(camX<0)camX=0;

  // Particles
  for(var i=particles.length-1;i>=0;i--){
    var pt=particles[i];
    pt.x+=pt.vx||0;pt.y+=(pt.vy||0);pt.life--;
    if(pt.type==='football'){pt.vy+=0.15;pt.rot=(pt.rot||0)+(pt.vx||0)*0.15}
    else if(pt.type!=='arrow')pt.vy=(pt.vy||0)+0.1;
    if(pt.life<=0)particles.splice(i,1);
  }

  // Screen shake
  if(shakeTime>0){shakeTime--;shakeX=(Math.random()-0.5)*shakeTime;shakeY=(Math.random()-0.5)*shakeTime}
  else{shakeX=0;shakeY=0}

  // Bob coins
  for(var i=0;i<coins.length;i++)coins[i].bob+=0.05;
}
function range(e){return e.range||100}

function die(){
  lives--;
  addShake(10);
  spawnParticles(player.x+player.w/2,player.y+player.h/2,'#ef4444',15);
  if(lives<=0){state='gameover'}
  else{player.x=Math.max(80,camX+80);player.y=H*0.3;player.vy=0;player.vx=0;player.invincible=90}
}

function spawnParticles(x,y,color,n){
  for(var i=0;i<n;i++){
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-2,
      life:20+Math.random()*20,color:color,type:'spark',s:2+Math.random()*3});
  }
}
function addShake(t){shakeTime=Math.max(shakeTime,t)}

// === DRAW ===
function draw(){
  X.clearRect(0,0,W,H);

  if(state==='menu'){drawMenu();return}
  if(state==='gameover'){drawGameOver();return}
  if(state==='win'){drawWin();return}

  X.save();X.translate(shakeX,shakeY);

  // Sky gradient
  var grd=X.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#0a0e1a');grd.addColorStop(0.5,'#1a1a3a');grd.addColorStop(1,'#2a1a1a');
  X.fillStyle=grd;X.fillRect(0,0,W,H);

  // Stars
  for(var i=0;i<bgStars.length;i++){
    var s=bgStars[i];
    var sx=(s.x-camX*0.2)%W;if(sx<0)sx+=W;
    X.globalAlpha=0.3+0.7*Math.abs(Math.sin(Date.now()*0.001+s.b*10));
    X.fillStyle='#e8dcc8';X.fillRect(sx,s.y,s.s,s.s);
  }
  X.globalAlpha=1;

  // Mountains parallax
  drawMountains(camX*0.15,'#0f1525',H*0.5,0.7);
  drawMountains(camX*0.3,'#151d30',H*0.6,0.5);

  // Platforms
  for(var i=0;i<platforms.length;i++){
    var pl=platforms[i];
    if(pl.x+pl.w<camX-50||pl.x>camX+W+50)continue;
    if(pl.type==='ground'){
      var pg=X.createLinearGradient(0,pl.y,0,pl.y+pl.h);
      pg.addColorStop(0,'#3d5a3a');pg.addColorStop(0.1,'#2a3a2a');pg.addColorStop(1,'#1a251a');
      X.fillStyle=pg;X.fillRect(pl.x-camX,pl.y,pl.w,pl.h);
      X.fillStyle='#5a8a5a';X.fillRect(pl.x-camX,pl.y,pl.w,4);
    }else{
      X.fillStyle='#4a6a4a';
      X.fillRect(pl.x-camX,pl.y,pl.w,pl.h);
      X.fillStyle='#6a9a6a';X.fillRect(pl.x-camX,pl.y,pl.w,3);
    }
  }

  // Coins
  for(var i=0;i<coins.length;i++){
    var c=coins[i];
    if(c.collected)continue;
    var cx=c.x-camX,cy=c.y+Math.sin(c.b)*4;
    if(cx<-20||cx>W+20)continue;
    X.fillStyle='#eab308';
    X.beginPath();X.arc(cx,cy,8,0,Math.PI*2);X.fill();
    X.fillStyle='#fbbf24';
    X.beginPath();X.arc(cx-1,cy-1,5,0,Math.PI*2);X.fill();
  }

  // Enemies
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.alive)continue;
    var ex=e.x-camX,ey=e.y;
    if(ex<-60||ex>W+60)continue;

    if(e.isBoss){
      drawBoss(ex,ey+e.jumpY,e);
    }else if(e.type==='archer'){
      drawArcher(ex,ey,e);
    }else{
      drawSoldier(ex,ey,e);
    }
  }

  // Particles
  for(var i=0;i<particles.length;i++){
    var pt=particles[i];
    var px=pt.x-camX;
    if(pt.type==='arrow'){
      X.fillStyle='#a0a0a0';
      X.fillRect(px,pt.y,pt.w,pt.h);
      X.fillStyle='#c0c0c0';
      X.beginPath();X.moveTo(px+(pt.vx>0?pt.w:-2),pt.y+pt.h/2);
      X.lineTo(px+(pt.vx>0?pt.w+6:-(pt.w+6)),pt.y);X.lineTo(px+(pt.vx>0?pt.w+6:-(pt.w+6)),pt.y+pt.h);X.fill();
    }else if(pt.type==='football'){
      // Draw football (蹴鞠)
      X.save();X.translate(px,pt.y);X.rotate(pt.rot||0);
      // Ball body
      X.fillStyle=pt.color||'#f5f5dc';
      X.beginPath();X.arc(0,0,pt.r,0,Math.PI*2);X.fill();
      // Pentagon pattern
      X.fillStyle=pt.isPower?'#cc0000':'#333';
      for(var j=0;j<5;j++){
        var a=j*Math.PI*2/5;
        X.beginPath();X.arc(Math.cos(a)*pt.r*0.45,Math.sin(a)*pt.r*0.45,pt.r*0.25,0,Math.PI*2);X.fill();
      }
      // Outline
      X.strokeStyle=pt.isPower?'#ff4444':'#555';X.lineWidth=1.5;
      X.beginPath();X.arc(0,0,pt.r,0,Math.PI*2);X.stroke();
      // Power glow
      if(pt.isPower){
        X.globalAlpha=0.3;X.fillStyle='#ff0000';
        X.beginPath();X.arc(0,0,pt.r+5,0,Math.PI*2);X.fill();X.globalAlpha=1;
        // Speed trail
        X.globalAlpha=0.15;X.fillStyle=pt.color||'#ff4444';
        X.beginPath();X.arc(-pt.vx*3,0,pt.r*0.8,0,Math.PI*2);X.fill();
        X.beginPath();X.arc(-pt.vx*6,0,pt.r*0.5,0,Math.PI*2);X.fill();X.globalAlpha=1;
      }
      X.restore();
    }else{
      X.globalAlpha=pt.life/30;
      X.fillStyle=pt.color;
      X.fillRect(px-pt.s/2,pt.y-pt.s/2,pt.s,pt.s);
      X.globalAlpha=1;
    }
  }

  // Goal flag
  var gx=goalX-camX;
  X.fillStyle='#22c55e';X.fillRect(gx,H*0.3,4,H*0.48);
  X.fillStyle='#16a34a';X.fillRect(gx,H*0.3,30,20);
  X.fillStyle='#fff';X.font='bold 11px sans-serif';X.fillText('终点',gx+4,H*0.44);

  // Player
  drawPlayer();

  // HUD
  drawHUD();

  X.restore();
}

function drawMountains(offset,color,baseY,scale){
  X.fillStyle=color;
  X.beginPath();X.moveTo(0,H);
  for(var x=0;x<=W;x+=3){
    var nx=x+offset*0.5;
    var h=Math.sin(nx*0.005)*40*scale+Math.sin(nx*0.012)*25*scale+Math.cos(nx*0.003)*30*scale;
    X.lineTo(x,baseY-h);
  }
  X.lineTo(W,H);X.closePath();X.fill();
}

function drawPlayer(){
  var p=player,px=p.x-camX,py=p.y;
  if(p.invincible>0&&Math.floor(p.invincible/4)%2===0)return;

  X.save();
  X.translate(px+p.w/2,py+p.h/2);
  X.scale(p.facing,1);
  X.translate(-p.w/2,-p.h/2);

  var breathe=Math.sin(Date.now()*0.004)*0.5;
  var runOffset=p.grounded?Math.sin(Date.now()*0.015)*2:0;
  var attackGlow=p.attacking&&p.atkTimer>6?3+Math.sin(Date.now()*0.05)*2:0;

  // GLOW outline (Dead Cells style)
  if(attackGlow>0){
    X.shadowColor='#ff4444';X.shadowBlur=8+attackGlow;
  }else{
    X.shadowColor='rgba(196,62,62,0.3)';X.shadowBlur=4;
  }

  // === LEGS ===
  X.shadowBlur=0;
  var l1=6+runOffset,l2=15-runOffset;
  if(!p.grounded){l1=8;l2=13;}
  // Thighs
  X.fillStyle='#1a1a2e';
  X.fillRect(l1,30,8,10);
  X.fillRect(l2,30,8,10);
  // Shins
  X.fillStyle='#2a2a3e';
  X.fillRect(l1+1,38,6,8);
  X.fillRect(l2+1,38,6,8);
  // Boots (leather wraps)
  X.fillStyle='#5a3a1a';
  X.fillRect(l1-1,44,9,4);
  X.fillRect(l2-1,44,9,4);
  // Boot detail
  X.fillStyle='#3a2a0a';
  X.fillRect(l1,46,7,2);
  X.fillRect(l2,46,7,2);

  // === TORSO ===
  // Main body
  X.fillStyle='#8b1a1a';
  X.fillRect(4,12+breathe,20,22);
  // Chest plate / armor
  X.fillStyle='#6a1212';
  X.fillRect(6,14+breathe,16,14);
  // Gold center emblem
  X.fillStyle='#d4a843';
  X.fillRect(12,16+breathe,4,10);
  // Shoulder pad left
  X.fillStyle='#4a0a0a';
  X.fillRect(2,11+breathe,6,8);
  X.fillStyle='#6a1a1a';
  X.fillRect(3,12+breathe,4,5);
  // Shoulder pad right
  X.fillStyle='#4a0a0a';
  X.fillRect(22,11+breathe,6,8);
  X.fillStyle='#6a1a1a';
  X.fillRect(23,12+breathe,4,5);
  // Belt
  X.fillStyle='#3a2a0a';
  X.fillRect(5,34+breathe,18,4);
  X.fillStyle='#d4a843';
  X.fillRect(12,34+breathe,4,4);

  // === ARM (back arm, holding spear behind) ===
  X.fillStyle='#d4a574';
  X.fillRect(20,16+breathe,6,14);
  // Sleeve
  X.fillStyle='#6a1212';
  X.fillRect(20,14+breathe,7,8);

  // === HEAD ===
  // Neck
  X.fillStyle='#d4a574';
  X.fillRect(10,8+breathe,8,4);
  // Face
  X.fillStyle='#e8c494';
  X.fillRect(8,0+breathe,14,12);
  // Hair / Headband flowing back
  X.fillStyle='#1a0a0a';

  X.fillStyle='#1a0a0a';

  X.fillStyle='#8a5a3a';

  // Shaft

  X.fillRect(24,2,3,42);
  // Shaft texture
  X.fillStyle='#3a2a1a';
  X.fillRect(25,4,1,38);
  // Spear head
  X.fillStyle='#c0c0c0';
  X.beginPath();
  X.moveTo(25.5,0);X.lineTo(28,2);X.lineTo(23,2);
  X.closePath();X.fill();
  // Spear edge
  X.fillStyle='#e0e0e0';
  X.beginPath();
  X.moveTo(25.5,0);X.lineTo(26.5,2);X.lineTo(24.5,2);

  // === FRONT ARM ===
  X.fillStyle='#d4a574';
  X.fillRect(8,18+breathe,6,12);
  // Sleeve
  X.fillStyle='#6a1212';
  X.fillRect(7,16+breathe,7,8);
  // Hand
  X.fillStyle='#e8c494';
  X.fillRect(8,28+breathe,6,5);

  // === ATTACK EFFECTS (Dead Cells style slash) ===
  if(p.attacking&&p.atkTimer>6){
    var slashProgress=(12-p.atkTimer)/6;
    // White core slash
    X.globalAlpha=0.6+slashProgress*0.4;
    X.strokeStyle='#fff';X.lineWidth=3;
    X.beginPath();
    X.arc(22,22,22,-1.2+slashProgress*0.3,0.8+slashProgress*0.3);
    X.stroke();
    // Red outer slash
    X.strokeStyle='#ff4444';X.lineWidth=1;
    X.beginPath();
    X.arc(22,22,26,-1.4+slashProgress*0.2,1.0+slashProgress*0.2);
    X.stroke();
    // Spark particles along slash
    X.globalAlpha=0.8;
    for(var sp=0;sp<5;sp++){
      var sa=-0.8+sp*0.4;
      var sr=18+Math.random()*8;
      X.fillStyle='#fff';
      X.fillRect(22+Math.cos(sa)*sr,22+Math.sin(sa)*sr,2+Math.random()*2,2+Math.random()*2);
    }
    X.globalAlpha=1;
  }

  // === GROUND SHADOW ===
  if(p.grounded){
    X.shadowBlur=0;
    X.fillStyle='rgba(0,0,0,0.2)';
    X.beginPath();
    X.ellipse(p.w/2,p.h+2,12,3,0,0,Math.PI*2);
    X.fill();
  }

  X.restore();
}

    X.fillRect(b2x+12,b2y+14,26,12);
    // Gold accents

    X.fillRect(b2x+10,b2y+8,e.w-20,4);

    X.fillStyle='#f00';
    X.fillRect(b2x+21,b2y-5,3,2);X.fillRect(b2x+31,b2y-5,3,2);

    // HP bar
    var maxHp2=5+(level-1)*3;

  X.fillStyle='#eab308';X.font='bold 28px sans-serif';X.fillText('最终得分: '+score,W/2,H*0.5);

  var bx=W/2-100,by=H*0.62,bw=200,bh=50;
  X.fillStyle='#22c55e';roundRect(X,bx,by,bw,bh,10);X.fill();
  X.fillStyle='#fff';X.font='bold 20px sans-serif';X.fillText('再闯一次',W/2,by+32);
  X.textAlign='left';
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// === CLICK HANDLER ===
C.addEventListener('click',function(e){
  var mx=e.clientX,my=e.clientY;
  if(state==='menu'){
    var bx=W/2-100,by=H*0.74;
    if(mx>bx&&mx<bx+200&&my>by&&my<by+50){
      state='playing';level=1;lives=3;score=0;buildLevel(level);
    }
  }else if(state==='gameover'||state==='win'){
    var bx=W/2-100,by=H*0.6;
    if(state==='win')by=H*0.62;
    if(mx>bx&&mx<bx+200&&my>by&&my<by+50){
      state='playing';level=1;lives=3;score=0;buildLevel(level);
    }
  }
});

// === GAME LOOP ===
function loop(){
  update();draw();requestAnimationFrame(loop);
}
loop();

})();
</script>
