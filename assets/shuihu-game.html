  X.fillStyle='#7a4a3a';X.fillRect(-4,-26,8,2);

  X.restore();
}

// ========== BACKGROUND DRAWING ==========
function drawBackground(bgName){
  var grd=X.createLinearGradient(0,0,0,H);
  if(bgName==='prison_yard'){
    grd.addColorStop(0,'#2a1a10');grd.addColorStop(1,'#1a0e05');
    X.fillStyle=grd;X.fillRect(0,0,W,H);
    // Stone wall
    X.fillStyle='#3a2a1a';
    for(var i=0;i<W;i+=80){
      for(var j=0;j<H;j+=40){
        X.fillRect(i,j,78,38);
        X.strokeStyle='#2a1a0a';X.lineWidth=1;
        X.strokeRect(i,j,78,38);
      }
    }
    // Gate
    X.fillStyle='#1a1a0a';X.fillRect(W*0.3,H*0.1,W*0.4,H*0.8);
    X.fillStyle='#4a3a2a';X.fillRect(W*0.3,H*0.1,W*0.4,8);
    X.fillStyle='#4a3a2a';X.fillRect(W*0.3,H*0.85,W*0.4,8);
    // Bars
    for(var i=0;i<5;i++){
      X.fillStyle='#666';X.fillRect(W*0.35+i*W*0.06,H*0.15,4,H*0.65);
    }
  }else if(bgName==='tavern_inside'){
    grd.addColorStop(0,'#1a1210');grd.addColorStop(1,'#2a1a10');
    X.fillStyle=grd;X.fillRect(0,0,W,H);
    // Wooden walls
    X.fillStyle='#3a2810';X.fillRect(0,0,W,H*0.3);X.fillRect(0,H*0.3,W,H*0.7);
    // Wood grain
    X.strokeStyle='#2a1808';X.lineWidth=1;
    for(var i=0;i<W;i+=15){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.stroke()}
    // Tables
    X.fillStyle='#5a3a1a';
    for(var i=0;i<3;i++){
      X.fillRect(W*0.1+i*W*0.3,H*0.6,W*0.2,H*0.03);
      X.fillRect(W*0.1+i*W*0.3-3,H*0.55,W*0.2+6,H*0.08);
    }
    // Lanterns
    for(var i=0;i<4;i++){
      var lx=W*0.15+i*W*0.25,ly=H*0.15;
      X.fillStyle='rgba(220,160,40,0.15)';X.beginPath();X.arc(lx,ly,25,0,Math.PI*2);X.fill();
      X.fillStyle='#8B6914';X.fillRect(lx-1,ly-15,2,30);
      X.fillStyle='#d4a843';
      X.beginPath();X.arc(lx,ly,8,0,Math.PI*2);X.fill();
    }
    // Banner
    X.fillStyle='#c43e3e';X.fillRect(W*0.45,H*0.05,W*0.1,H*0.25);
    X.fillStyle='#d4a843';X.font='bold 16px serif';X.textAlign='center';
    X.fillText('快活林',W*0.5,H*0.18);X.textAlign='left';
  }else if(bgName==='tavern_celebration'){
    grd.addColorStop(0,'#2a1a0a');grd.addColorStop(1,'#1a0e05');
    X.fillStyle=grd;X.fillRect(0,0,W,H);
    // Warm lighting
    X.fillStyle='rgba(220,160,40,0.08)';
    X.beginPath();X.arc(W*0.5,H*0.3,200,0,Math.PI*2);X.fill();
    // Same structure as tavern_inside but warmer
    X.fillStyle='#3a2810';X.fillRect(0,0,W,H*0.3);X.fillRect(0,H*0.3,W,H*0.7);
    X.strokeStyle='#2a1808';X.lineWidth=1;
    for(var i=0;i<W;i+=15){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.stroke()}
    // Tables
    X.fillStyle='#5a3a1a';
    for(var i=0;i<3;i++){
      X.fillRect(W*0.1+i*W*0.3,H*0.6,W*0.2,H*0.03);
      X.fillRect(W*0.1+i*W*0.3-3,H*0.55,W*0.2+6,H*0.08);
    }
    // More lanterns, brighter
    for(var i=0;i<6;i++){
      var lx=W*0.1+i*W*0.16,ly=H*0.12;
      X.fillStyle='rgba(220,160,40,0.2)';X.beginPath();X.arc(lx,ly,30,0,Math.PI*2);X.fill();
      X.fillStyle='#8B6914';X.fillRect(lx-1,ly-18,2,36);
      X.fillStyle='#d4a843';
      X.beginPath();X.arc(lx,ly,10,0,Math.PI*2);X.fill();
    }
    // Banner - restored
    X.fillStyle='#c43e3e';X.fillRect(W*0.42,H*0.03,W*0.16,H*0.3);
    X.fillStyle='#d4a843';X.font='bold 18px serif';X.textAlign='center';
    X.fillText('快活林',W*0.5,H*0.17);X.textAlign='left';
  }else{
    // Default dark
    grd.addColorStop(0,'#0a0e1a');grd.addColorStop(1,'#1a0a0a');
    X.fillStyle=grd;X.fillRect(0,0,W,H);
    // Stars
    for(var i=0;i<30;i++){
      X.fillStyle='#e8dcc8';X.globalAlpha=0.3+Math.random()*0.5;
      X.fillRect(Math.random()*W,Math.random()*H*0.5,1.5,1.5);
    }
    X.globalAlpha=1;
    // Mountains
    X.fillStyle='#151d30';
    X.beginPath();X.moveTo(0,H);
    for(var x=0;x<=W;x+=4){
      var h=Math.sin(x*0.005)*30+Math.sin(x*0.012)*20;
      X.lineTo(x,H*0.5-h);
    }
    X.lineTo(W,H);X.closePath();X.fill();
  }
}

// ========== DIALOG BOX ==========
function drawDialogBox(speaker,text,isNarration){
  var boxY=H*0.62;
  var boxH=H*0.36;
  var boxW=Math.min(W*0.9,800);
  var boxX=(W-boxW)/2;

  // Box background
  X.fillStyle='rgba(10,8,6,0.92)';
  roundRect(X,boxX,boxY,boxW,boxH,12);X.fill();
  // Border
  X.strokeStyle='#d4a843';X.lineWidth=2;
  roundRect(X,boxX,boxY,boxW,boxH,12);X.stroke();
  // Inner border
  X.strokeStyle='rgba(212,168,67,0.3)';X.lineWidth=1;
  roundRect(X,boxX+4,boxY+4,boxW-8,boxH-8,10);X.stroke();

  if(isNarration){
    // Narration style
    X.fillStyle='#d4a843';X.font='14px serif';
    X.textAlign='center';
    X.fillText('— 旁白 —',W/2,boxY+28);
    X.fillStyle='#c8b88a';X.font='15px sans-serif';
    wrapText(X,text,boxX+30,boxY+50,boxW-60,22);
  }else{
    // Speaker name plate
    X.fillStyle='rgba(196,62,62,0.8)';
    roundRect(X,boxX+15,boxY+12,120,26,6);X.fill();
    X.fillStyle='#fff';X.font='bold 14px sans-serif';
    X.textAlign='center';
    X.fillText(speaker,boxX+75,boxY+30);
    // Text
    X.fillStyle='#e8dcc8';X.font='15px sans-serif';X.textAlign='left';
    wrapText(X,text,boxX+25,boxY+55,boxW-50,22);
  }
  X.textAlign='left';

  // Continue indicator
  if(textDone){
    var blink=Math.sin(Date.now()*0.005)>0;
    if(blink){
      X.fillStyle='#d4a843';X.font='12px sans-serif';X.textAlign='right';
      X.fillText('▼ 点击继续',boxX+boxW-20,boxY+boxH-15);
      X.textAlign='left';
    }
  }
}

// ========== CHOICE BOXES ==========
var choiceBoxes=[];
function drawChoiceBoxes(options){
  choiceBoxes=[];
  var startY=H*0.45;
  var boxW=Math.min(W*0.7,500);
  var boxX=(W-boxW)/2;
  for(var i=0;i<options.length;i++){
    var by=startY+i*65;
    choiceBoxes.push({x:boxX,y:by,w:boxW,h:50,text:options[i].text,idx:i});
    // Box
    X.fillStyle='rgba(196,62,62,0.15)';
    roundRect(X,boxX,by,boxW,50,8);X.fill();
    X.strokeStyle='rgba(212,168,67,0.6)';X.lineWidth=1.5;
    roundRect(X,boxX,by,boxW,50,8);X.stroke();
    // Diamond icon
    X.fillStyle='#d4a843';X.font='14px sans-serif';
    X.fillText('\u25C6',boxX+15,by+30);
    // Text
    X.fillStyle='#e8dcc8';X.font='16px sans-serif';
    X.fillText(options[i].text,boxX+40,by+30);
  }
}

// ========== BATTLE SCENE ==========
var battleRounds=[], battleIdx=0, battleChar=null, battleEnemy=null;
function startBattle(enemy,rounds){
  battleRounds=rounds;battleIdx=0;state='battle';
  battleChar='wusong';battleEnemy=enemy;
}
function updateBattle(){
  // Auto advance battle text
  if(battleIdx>=battleRounds.length){state='playing';return}
  var r=battleRounds[battleIdx];
  if(!textDone)return;
  textTimer++;
  if(textTimer>60){textTimer=0;battleIdx++;advanceText(r.e);}
}
function drawBattle(){
  drawBackground('tavern_inside');
  // Shake
  var sx=0,sy=0;
  if(battleIdx<battleRounds.length&&battleRounds[battleIdx].eEffect==='fall'||battleRounds[battleIdx].eEffect==='defeat'){
    shakeTime=15;sx=(Math.random()-0.5)*shakeTime;sy=(Math.random()-0.5)*shakeTime;
  }
  X.save();X.translate(sx,sy);
  // Characters
  var r=battleRounds[Math.min(battleIdx,battleRounds.length-1)];
  drawWuSong(W*0.3,H*0.45,1.5,r?pAction:'idle':'idle');
  if(battleEnemy==='蒋门神'){
    var exp=battleIdx>=battleRounds.length-1?'defeated':'angry';
    drawJiangMenshen(W*0.7,H*0.45,1.5,exp);
  }
  X.restore();
  // VS
  X.fillStyle='#c43e3e';X.font='bold 28px serif';X.textAlign='center';
  X.fillText('VS',W/2,H*0.35);
  X.textAlign='left';
  // Dialog
  if(battleIdx<battleRounds.length){
    var br=battleRounds[battleIdx];
    drawDialogBox('对决',br.p+'。'+br.e,true);
  }
  // Progress
  X.fillStyle='#555';X.font='12px sans-serif';X.textAlign='center';
  X.fillText((battleIdx+1)+' / '+battleRounds.length,W/2,H*0.58);
  X.textAlign='left';
}

// ========== TITLE SCREEN ==========
function drawTitle(){
  drawBackground('title');
  // Decorative frame
  X.strokeStyle='#d4a843';X.lineWidth=2;
  roundRect(X,W*0.1,H*0.15,W*0.8,H*0.7,16);X.stroke();
  X.strokeStyle='rgba(212,168,67,0.3)';X.lineWidth=1;
  roundRect(X,W*0.1+6,H*0.15+6,W*0.8-12,H*0.7-12,12);X.stroke();

  // Title
  X.textAlign='center';
  X.fillStyle='#c43e3e';X.font='bold '+Math.min(W*0.1,56)+'px serif';
  X.fillText('水浒传',W/2,H*0.3);
  X.fillStyle='#d4a843';X.font='bold '+Math.min(W*0.05,28)+'px serif';
  X.fillText('武松醉打蒋门神',W/2,H*0.3+40);
  X.fillStyle='#7a8ba5';X.font='14px sans-serif';
  X.fillText('视觉小说 · 三章剧情',W/2,H*0.3+65);

  // Characters preview
  drawWuSong(W*0.3,H*0.55,0.6,'serious');
  drawJiangMenshen(W*0.7,H*0.55,0.6,'angry');
  X.fillStyle='#7a8ba5';X.font='12px sans-serif';X.textAlign='center';
  X.fillText('武松',W*0.3,H*0.55+55);X.fillText('蒋门神',W*0.7,H*0.55+55);
  X.textAlign='left';

  // Start button
  var bx=W/2-90,by=H*0.72;
  var pulse=Math.sin(Date.now()*0.003)*3;
  X.fillStyle='#c43e3e';
  roundRect(X,bx,by+pulse,180,50,10);X.fill();
  X.fillStyle='#e8dcc8';X.font='bold 20px sans-serif';X.textAlign='center';
  X.fillText('开始游戏',W/2,by+pulse+32);
  X.textAlign='left';

  // Controls
  X.fillStyle='#5a5a6a';X.font='12px sans-serif';X.textAlign='center';
  X.fillText('点击或按空格推进剧情',W/2,H*0.88);
  X.textAlign='left';
}

// ========== CHAPTER TRANSITION ==========
var chapterTimer=0;
function drawChapterTransition(){
  chapterTimer++;
  var a=Math.min(chapterTimer/30,1);
  X.fillStyle='rgba(10,8,6,'+a+')';X.fillRect(0,0,W,H);
  if(chapterTimer>30){
    var ch=chapters[chapter-1]||{title:'终',subtitle:''};
    X.textAlign='center';
    X.fillStyle='#c43e3e';X.font='bold '+Math.min(W*0.08,48)+'px serif';
    X.fillText(ch.title,W/2,H*0.4);
    X.fillStyle='#d4a843';X.font='bold '+Math.min(W*0.05,28)+'px serif';
    X.fillText(ch.subtitle,W/2,H*0.4+40);
    X.textAlign='left';
  }
  if(chapterTimer>90){state='playing';node=0;resetText()}
}

// ========== END SCREEN ==========
function drawEndScreen(){
  drawBackground('tavern_celebration');
  X.fillStyle='rgba(10,8,6,0.7)';X.fillRect(0,0,W,H);
  X.textAlign='center';
  X.fillStyle='#d4a843';X.font='bold '+Math.min(W*0.07,40)+'px serif';
  X.fillText('— 剧终 —',W/2,H*0.3);
  X.fillStyle='#e8dcc8';X.font='bold 18px sans-serif';
  X.fillText('武松醉打蒋门神 · 义夺快活林',W/2,H*0.3+40);
  X.fillStyle='#7a8ba5';X.font='14px sans-serif';
  X.fillText('行侠仗义，替天行道',W/2,H*0.3+70);

  drawWuSong(W*0.35,H*0.6,1,'smile');
  drawShiEn(W*0.65,H*0.6,1);

  var bx=W/2-90,by=H*0.75;
  X.fillStyle='#c43e3e';
  roundRect(X,bx,by,180,50,10);X.fill();
  X.fillStyle='#e8dcc8';X.font='bold 20px sans-serif';X.textAlign='center';
  X.fillText('重新开始',W/2,by+32);
  X.textAlign='left';
}

// ========== TEXT SYSTEM ==========
function resetText(){
  textDisplay='';charIdx=0;textDone=false;waitingChoice=false;
}
function advanceText(text){
  textBuffer=text;textDisplay='';charIdx=0;textDone=false;textTimer=0;
}
function updateText(){
  if(textDone)return;
  if(charIdx<textBuffer.length){
    textTimer++;
    if(textTimer>=textSpeed){
      textTimer=0;
      textDisplay+=textBuffer[charIdx];
      charIdx++;
    }
  }else{
    textDone=true;
  }
}
function skipText(){
  if(!textDone){textDisplay=textBuffer;charIdx=textBuffer.length;textDone=true}
}

// ========== MAIN UPDATE ==========
function update(){
  if(shakeTime>0)shakeTime--;

  if(fadeDir!==0){
    fadeAlpha+=fadeDir*0.03;
    if(fadeAlpha>=1){fadeAlpha=1;if(fadeCallback){fadeCallback();fadeCallback=null}}
    if(fadeAlpha<=0){fadeAlpha=0;fadeDir=0}
    return;
  }

  if(state==='title')return;

  if(state==='chapter_transition'){drawChapterTransition();return}

  if(state==='battle'){updateBattle();return}

  if(state==='end')return;

  if(state==='playing'){
    var ch=chapters[chapter];
    if(!ch||node>=ch.nodes.length)return;

    var nd=ch.nodes[node];
    if(waitingChoice)return;

    updateText();
    if(!textDone)return;

    // Auto advance for narration
    if(nd.type==='narration'||nd.type==='scene'){
      textTimer++;
      if(textTimer>80){
        textTimer=0;
        node++;
        if(node>=ch.nodes.length){advanceChapter();}
        else{processNode()}
      }
    }
  }
}

function processNode(){
  var ch=chapters[chapter];
  if(!ch||node>=ch.nodes.length)return;
  var nd=ch.nodes[node];
  resetText();
  if(nd.bg)currentBg=nd.bg;

  if(nd.type==='narration'||nd.type==='scene'){
    advanceText(nd.text);
  }else if(nd.type==='dialogue'){
    advanceText(nd.text);
  }else if(nd.type==='choice'){
    waitingChoice=true;
  }else if(nd.type==='battle'){
    startBattle(nd.enemy,nd.rounds);
  }else if(nd.type==='end_chapter'){
    fadeDir=1;
    fadeCallback=function(){
      chapter++;node=0;
      if(chapter>=chapters.length){state='end';resetText()}
      else{state='chapter_transition';chapterTimer=0}
    };
  }
}

function advanceChapter(){
  fadeDir=1;
  fadeCallback=function(){
    chapter++;node=0;
    if(chapter>=chapters.length){state='end';resetText()}
    else{state='chapter_transition';chapterTimer=0}
  };
}

// ========== MAIN DRAW ==========
function draw(){
  X.clearRect(0,0,W,H);

  // Fade overlay
  X.fillStyle='rgba(10,8,6,'+fadeAlpha+')';X.fillRect(0,0,W,H);

  if(state==='title'){drawTitle();return}
  if(state==='chapter_transition'){drawChapterTransition();return}
  if(state==='end'){drawEndScreen();return}
  if(state==='battle'){drawBattle();return}

  if(state==='playing'){
    var ch=chapters[chapter];
    if(!ch)return;
    var nd=ch.nodes[node];

    // Background
    drawBackground(currentBg);

    // Characters based on scene
    if(currentBg==='prison_yard'){
      drawWuSong(W*0.2,H*0.42,1,'serious');
    }else if(currentBg==='tavern_inside'){
      drawJiangMenshen(W*0.7,H*0.42,0.9,'angry');
      drawWuSong(W*0.25,H*0.42,0.9,nd&&nd.speaker==='武松'?'drunk':'serious');
    }else if(currentBg==='tavern_celebration'){
      drawWuSong(W*0.3,H*0.42,0.9,'smile');
      drawShiEn(W*0.7,H*0.42,0.9);
    }

    // Dialog
    if(!waitingChoice&&nd){
      var isNar=nd.type==='narration';
      var spk=nd.speaker||'';
      drawDialogBox(spk,textDisplay,isNar);
    }

    // Choices
    if(waitingChoice){
      drawChoiceBoxes(nd.options);
    }

    // Chapter indicator
    X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(0,0,W,36);
    X.fillStyle='#d4a843';X.font='bold 13px serif';
    X.fillText(ch.title+' · '+ch.subtitle,16,24);
    X.fillStyle='#555';X.font='12px sans-serif';
    var progress=Math.round((node/ch.nodes.length)*100);
    X.fillText('进度 '+progress+'%',W-80,24);
  }
}

// ========== INPUT ==========
C.addEventListener('click',function(e){
  var mx=e.clientX,my=e.clientY;

  if(state==='title'){
    var bx=W/2-90,by=H*0.72;
    if(mx>bx&&mx<bx+180&&my>by&&my<by+50){
      state='playing';chapter=0;node=0;resetText();processNode();
    }
    return;
  }

  if(state==='end'){
    var bx=W/2-90,by=H*0.75;
    if(mx>bx&&mx<bx+180&&my>by&&my<by+50){
      state='title';
    }
    return;
  }

  if(state==='battle'){
    if(!textDone){skipText();return}
    textTimer=55;// auto advance faster
    return;
  }

  if(state==='playing'){
    if(waitingChoice){
      for(var i=0;i<choiceBoxes.length;i++){
        var cb=choiceBoxes[i];
        if(mx>cb.x&&mx<cb.x+cb.w&&my>cb.y&&my<cb.y+cb.h){
          waitingChoice=false;
          node=chapters[chapter].nodes[node].options[i].next;
          processNode();
          return;
        }
      }
      return;
    }

    if(!textDone){skipText();return}

    var ch=chapters[chapter];
    var nd=ch.nodes[node];
    if(nd.type==='narration'||nd.type==='scene'){
      textTimer=70;// auto advance
    }else{
      node++;
      if(node>=ch.nodes.length){advanceChapter()}
      else{processNode()}
    }
  }
});

document.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    C.dispatchEvent(new MouseEvent('click',{clientX:W/2,clientY:H*0.8}));
  }
});

// ========== UTILITIES ==========
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function wrapText(ctx,text,x,y,maxW,lineH){
  var line='';
  for(var i=0;i<text.length;i++){
    var test=line+text[i];
    if(ctx.measureText(test).width>maxW){
      ctx.fillText(line,x,y);y+=lineH;line=text[i]||'';
    }else{line=test}
  }
  if(line)ctx.fillText(line,x,y);
}

// ========== GAME LOOP ==========
function loop(){
  update();draw();requestAnimationFrame(loop);
}
loop();

})();
</script>
